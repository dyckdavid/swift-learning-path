name: AccessibilityLab
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: AccessibilityLab/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.AccessibilityLab
targets:
  AccessibilityLab:
    type: application
    platform: iOS
    sources:
      - AccessibilityLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.AccessibilityLab
        INFOPLIST_FILE: AccessibilityLab/Info.plist
