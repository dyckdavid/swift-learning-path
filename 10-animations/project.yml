name: AnimationsLab
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: AnimationsLab/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.AnimationsLab
targets:
  AnimationsLab:
    type: application
    platform: iOS
    sources:
      - AnimationsLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.AnimationsLab
        INFOPLIST_FILE: AnimationsLab/Info.plist
