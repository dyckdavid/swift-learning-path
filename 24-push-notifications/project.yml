name: PushNotificationsLab
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: PushNotificationsLab/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.PushNotificationsLab
targets:
  PushNotificationsLab:
    type: application
    platform: iOS
    sources:
      - PushNotificationsLab
    entitlements:
      path: PushNotificationsLab/PushNotificationsLab.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.PushNotificationsLab
        INFOPLIST_FILE: PushNotificationsLab/Info.plist
