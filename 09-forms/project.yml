name: FormsLab
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: FormsLab/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.FormsLab
targets:
  FormsLab:
    type: application
    platform: iOS
    sources:
      - FormsLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.FormsLab
        INFOPLIST_FILE: FormsLab/Info.plist
