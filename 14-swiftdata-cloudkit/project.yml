name: SwiftDataCloudKit
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: SwiftDataCloudKit/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.SwiftDataCloudKit
targets:
  SwiftDataCloudKit:
    type: application
    platform: iOS
    sources:
      - SwiftDataCloudKit
    entitlements:
      path: SwiftDataCloudKit/SwiftDataCloudKit.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.SwiftDataCloudKit
        INFOPLIST_FILE: SwiftDataCloudKit/Info.plist
