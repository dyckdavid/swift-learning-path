name: StateObservation
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: StateObservation/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.StateObservation
targets:
  StateObservation:
    type: application
    platform: iOS
    sources:
      - StateObservation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.StateObservation
        INFOPLIST_FILE: StateObservation/Info.plist
