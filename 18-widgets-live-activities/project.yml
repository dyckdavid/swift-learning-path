name: WidgetsLiveActivities
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: WidgetsLiveActivities/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.WidgetsLiveActivities
targets:
  WidgetsLiveActivities:
    type: application
    platform: iOS
    sources:
      - WidgetsLiveActivities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.WidgetsLiveActivities
        INFOPLIST_FILE: WidgetsLiveActivities/Info.plist
