name: AppIntentsLab
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: AppIntentsLab/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.AppIntentsLab
targets:
  AppIntentsLab:
    type: application
    platform: iOS
    sources:
      - AppIntentsLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.AppIntentsLab
        INFOPLIST_FILE: AppIntentsLab/Info.plist
