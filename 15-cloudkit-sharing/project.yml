name: CloudKitSharing
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: CloudKitSharing/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.CloudKitSharing
targets:
  CloudKitSharing:
    type: application
    platform: iOS
    sources:
      - CloudKitSharing
    entitlements:
      path: CloudKitSharing/CloudKitSharing.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.CloudKitSharing
        INFOPLIST_FILE: CloudKitSharing/Info.plist
