name: PerformanceLab
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: PerformanceLab/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.PerformanceLab
targets:
  PerformanceLab:
    type: application
    platform: iOS
    sources:
      - PerformanceLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.PerformanceLab
        INFOPLIST_FILE: PerformanceLab/Info.plist
