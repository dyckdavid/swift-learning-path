name: NavigationLists
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: NavigationLists/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.NavigationLists
targets:
  NavigationLists:
    type: application
    platform: iOS
    sources:
      - NavigationLists
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.NavigationLists
        INFOPLIST_FILE: NavigationLists/Info.plist
