name: LocalizationLab
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: LocalizationLab/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.LocalizationLab
targets:
  LocalizationLab:
    type: application
    platform: iOS
    sources:
      - LocalizationLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.LocalizationLab
        INFOPLIST_FILE: LocalizationLab/Info.plist
