name: SwiftDataLab
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: SwiftDataLab/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.SwiftDataLab
targets:
  SwiftDataLab:
    type: application
    platform: iOS
    sources:
      - SwiftDataLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.SwiftDataLab
        INFOPLIST_FILE: SwiftDataLab/Info.plist
