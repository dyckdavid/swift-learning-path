name: StoreKitLab
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: StoreKitLab/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.StoreKitLab
targets:
  StoreKitLab:
    type: application
    platform: iOS
    sources:
      - StoreKitLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.StoreKitLab
        INFOPLIST_FILE: StoreKitLab/Info.plist
