name: CloudKitFundamentals
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: CloudKitFundamentals/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.CloudKitFundamentals
targets:
  CloudKitFundamentals:
    type: application
    platform: iOS
    sources:
      - CloudKitFundamentals
    entitlements:
      path: CloudKitFundamentals/CloudKitFundamentals.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.CloudKitFundamentals
        INFOPLIST_FILE: CloudKitFundamentals/Info.plist
