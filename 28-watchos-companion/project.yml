name: WatchCompanion
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: WatchCompanion/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.WatchCompanion
targets:
  WatchCompanion:
    type: application
    platform: iOS
    sources:
      - WatchCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.WatchCompanion
        INFOPLIST_FILE: WatchCompanion/Info.plist
