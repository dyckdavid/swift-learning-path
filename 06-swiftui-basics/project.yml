name: SwiftUIBasics
options:
  bundleIdPrefix: com.swiftlearning
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: SwiftUIBasics/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.SwiftUIBasics
targets:
  SwiftUIBasics:
    type: application
    platform: iOS
    sources:
      - SwiftUIBasics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftlearning.SwiftUIBasics
        INFOPLIST_FILE: SwiftUIBasics/Info.plist
